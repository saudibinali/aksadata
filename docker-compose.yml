# Local development: database only. The Next.js app runs on the host.
# Full container app: docker compose --profile app up --build
# Host ports are 5433 and 3001 so this stack can run beside other local projects.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - aksa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    profiles: ["app"]
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_ROOT: /var/lib/aksadata/media
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - .env
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - aksa_media:/var/lib/aksadata/media
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma generate && npm run dev -- --hostname 0.0.0.0 --port 3000"

volumes:
  aksa_pg:
  aksa_media:
  web_node_modules:
